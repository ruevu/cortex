name: sidecar-tarball

# Builds the self-contained sidecar tarball Mesh embeds (see mesh's
# docs/superpowers/specs/2026-08-03-embedded-cortex-sidecar-design.md).
# Runs when a release is published, or manually for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.8.1)"
        required: true

permissions:
  contents: write # gh release upload

jobs:
  tarball:
    # macos-14 was retired: GitHub refuses the job with "The configuration
    # 'macos-14-arm64-us-default' is not supported" and cancels it before any
    # step runs, so v2.4.8 shipped with no tarball. macos-15 is the arm64 image.
    runs-on: macos-15 # arm64 — the only published sidecar platform
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # postinstall fetches bin/cortex-indexer (pinned version) — required cargo.
      - name: Install
        run: npm ci

      - name: Guard — tag matches package.json
        run: |
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "tag $TAG != package.json $PKG" >&2; exit 1
          fi
          test -x bin/cortex-indexer || { echo "bin/cortex-indexer missing (postinstall failed?)" >&2; exit 1; }

      - name: Build
        run: npm run build && npm run build:viewer

      - name: Assemble staging tree
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/sidecar-stage"
          mkdir -p "$STAGE"
          cp package.json "$STAGE/"
          cp -R dist "$STAGE/dist"
          mkdir -p "$STAGE/src/viewer"
          cp -R src/viewer/dist "$STAGE/src/viewer/dist"
          mkdir -p "$STAGE/bin"
          cp bin/cortex-indexer "$STAGE/bin/cortex-indexer"
          chmod 755 "$STAGE/bin/cortex-indexer"
          cp -R skills "$STAGE/skills"
          cp -R hooks "$STAGE/hooks"
          # Frame extraction's clusterer is a Python script the runtime opens
          # by path (cluster-tfidf-hdbscan.ts's PYTHON_SCRIPT, resolved under
          # the package root). Leaving it out broke nothing loudly: python
          # exits 2, runFrameExtraction is contractually never-throws and
          # reports "failed", and the index still returns success — so every
          # packaged sidecar shipped a canvas that could not draw a frame.
          # setup-venv.sh rides along; venv.ts execs it by the same path.
          mkdir -p "$STAGE/scripts/frame-extraction"
          cp -R scripts/frame-extraction/python "$STAGE/scripts/frame-extraction/python"
          # Sidecar-variant plugin manifest: skills + hooks ONLY. Mesh injects
          # the MCP transport itself (--mcp-config, HTTP); a mcpServers key here
          # would double-spawn a server the packaged tree cannot run (no tsx).
          node -e '
            const fs = require("fs");
            const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            fs.writeFileSync(process.argv[1] + "/plugin.json", JSON.stringify({
              name: "mesh-cortex",
              version,
              description: "Cortex skills + hooks for the Mesh-embedded sidecar (MCP arrives via Mesh-injected HTTP config)",
              skills: "./skills/",
              hooks: "./hooks/hooks.json",
            }, null, 2) + "\n");
          ' "$STAGE"
          # Production node_modules: fresh install with cortex's own postinstall
          # stripped (no indexer refetch, no git hooks) — dependency install
          # scripts still run (ripgrep binary, better-sqlite3 build).
          PROD="$RUNNER_TEMP/prod-install"
          mkdir -p "$PROD"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete p.scripts.postinstall;
            fs.writeFileSync(process.argv[1] + "/package.json", JSON.stringify(p, null, 2));
          ' "$PROD"
          cp package-lock.json "$PROD/"
          (cd "$PROD" && npm ci --omit=dev)
          mv "$PROD/node_modules" "$STAGE/node_modules"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # The extracted tree must actually serve before it may ship. The sidecar
      # exits on stdin EOF, so hold stdin open while polling.
      - name: Smoke test
        run: |
          set -euo pipefail
          PORT=4599
          # Run with cwd outside $STAGE — the sidecar resolves .cortex/ relative
          # to cwd when started outside a git repo, and $STAGE must stay pristine
          # (only the allowlisted tree gets tarred below).
          SCRATCH="$RUNNER_TEMP/smoke-cwd"
          mkdir -p "$SCRATCH"
          (cd "$SCRATCH" && sleep 300 | CORTEX_VIEWER_PORT=$PORT node "$STAGE/dist/index.js") &
          SIDE=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/api/projects" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "sidecar never became healthy" >&2; exit 1; }
          # /mcp answers JSON-RPC (initialize) — the endpoint mesh pins against.
          curl -fsS -X POST "http://127.0.0.1:$PORT/mcp" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | grep -q '"serverInfo"' || { echo "/mcp did not answer initialize" >&2; exit 1; }
          # Plugin assets staged and shaped right.
          test -d "$STAGE/skills/capture-decision" || { echo "skills/ missing" >&2; exit 1; }
          test -f "$STAGE/hooks/hooks.json" || { echo "hooks/ missing" >&2; exit 1; }
          # Frame-extraction assets. Presence is the only cheap signal: a
          # missing clusterer degrades silently at index time, never here.
          for f in scripts/frame-extraction/python/tfidf_hdbscan.py \
                   scripts/frame-extraction/python/setup-venv.sh; do
            test -f "$STAGE/$f" || { echo "$f missing" >&2; exit 1; }
          done
          node -e '
            const p = require(process.argv[1] + "/plugin.json");
            if (p.name !== "mesh-cortex" || !p.skills || !p.hooks || "mcpServers" in p) process.exit(1);
          ' "$STAGE" || { echo "staged plugin.json malformed" >&2; exit 1; }
          kill "$SIDE" 2>/dev/null || true

      - name: Tar, checksum, upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="cortex-sidecar-${VERSION}-darwin-arm64.tar.gz"
          # Allowlist, not cleanup: archive only the expected top-level
          # entries, so stray state (e.g. a .cortex/ dir written by some
          # future step) can never ship regardless of what touches $STAGE.
          # skills/hooks/plugin.json are the Mesh-embedded plugin surface —
          # see the "Assemble staging tree" step above. scripts/ carries the
          # frame-extraction Python the canvas depends on, and nothing else.
          tar -czf "$NAME" -C "$STAGE" package.json dist src node_modules bin skills hooks scripts plugin.json
          shasum -a 256 "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
          gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
